<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="quill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="50%" style="stop-color:#f4a261"/>
      <stop offset="100%" style="stop-color:#e76f51"/>
    </linearGradient>
    <linearGradient id="db" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4cc9f0"/>
      <stop offset="100%" style="stop-color:#4361ee"/>
    </linearGradient>
    <linearGradient id="ink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7209b7"/>
      <stop offset="100%" style="stop-color:#560bad"/>
    </linearGradient>
  </defs>
  
  <!-- Background rounded square -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bg)"/>
  
  <!-- Database cylinder (bottom) -->
  <ellipse cx="256" cy="370" rx="110" ry="32" fill="url(#db)" opacity="0.9"/>
  <rect x="146" y="310" width="220" height="60" fill="url(#db)" opacity="0.9"/>
  <ellipse cx="256" cy="310" rx="110" ry="32" fill="url(#db)" opacity="0.7"/>
  <ellipse cx="256" cy="310" rx="110" ry="32" fill="none" stroke="#4cc9f0" stroke-width="2" opacity="0.5"/>
  
  <!-- Data lines on cylinder -->
  <line x1="176" y1="335" x2="336" y2="335" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
  <line x1="176" y1="350" x2="316" y2="350" stroke="#ffffff" stroke-width="2" opacity="0.2"/>
  
  <!-- Quill feather -->
  <path d="M 340 80 
           C 300 120, 260 160, 230 220
           C 210 260, 200 290, 195 310
           L 210 305
           C 220 280, 240 240, 270 200
           C 310 150, 350 120, 380 100
           C 370 90, 355 82, 340 80 Z" 
        fill="url(#quill)" opacity="0.95"/>
  
  <!-- Quill barb lines -->
  <line x1="340" y1="90" x2="290" y2="170" stroke="#ffffff" stroke-width="1" opacity="0.2"/>
  <line x1="350" y1="95" x2="310" y2="160" stroke="#ffffff" stroke-width="1" opacity="0.15"/>
  <line x1="330" y1="88" x2="270" y2="180" stroke="#ffffff" stroke-width="1" opacity="0.15"/>
  
  <!-- Quill shaft (rachis) -->
  <path d="M 340 80 
           C 310 130, 260 200, 220 270
           C 205 295, 195 310, 190 320" 
        fill="none" stroke="#f4a261" stroke-width="3" opacity="0.8"/>
  
  <!-- Quill nib (tip) -->
  <path d="M 190 320 
           L 180 345 
           L 195 330 
           Z" 
        fill="#e94560"/>
  
  <!-- Ink drop -->
  <circle cx="178" cy="355" r="8" fill="url(#ink)" opacity="0.8"/>
  <circle cx="168" cy="368" r="4" fill="url(#ink)" opacity="0.5"/>
  
  <!-- Sparkle accents -->
  <circle cx="380" cy="140" r="3" fill="#ffffff" opacity="0.6"/>
  <circle cx="400" cy="170" r="2" fill="#ffffff" opacity="0.4"/>
  <circle cx="150" cy="280" r="2" fill="#4cc9f0" opacity="0.5"/>
</svg>
